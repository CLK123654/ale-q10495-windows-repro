name: WindowsPostgreSQLBusinessCheck

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: StartPostgreSQL
        shell: pwsh
        run: |
          Set-Service -Name postgresql-x64-17 -StartupType Manual
          Start-Service postgresql-x64-17
          $env:PGBIN | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: CheckBusinessPackage
        shell: pwsh
        env:
          PGPASSWORD: root
        run: ./verification/windows_gate.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-postgresql-evidence
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 1
